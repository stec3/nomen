<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomen</title>
<meta name="description" content="Type a name, get its planet. Every name makes its own 3D world, computed in your browser. No images, no libraries: only code.">
<meta name="theme-color" content="#04050a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2304050a'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%234f8fe6'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='7' fill='none' stroke='%23e8dcc0' stroke-width='3' transform='rotate(-18 32 32)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/stile.css">
</head>
<body>
<canvas id="tela" role="img"></canvas>
<div id="etichette" aria-hidden="true"></div>

<header class="marchio">
  <strong>Nomen</strong>
  <span>nomen omen</span>
</header>

<button id="copia" class="tasto" type="button"></button>

<main id="scheda" class="scheda">
  <h1 id="nome"></h1>
  <p id="riga"></p>
  <p id="posto"></p>
  <p id="rango"></p>
  <ul id="tratti"></ul>
  <details id="particolari">
    <summary id="apri"></summary>
    <div id="foglio"></div>
  </details>
  <form id="forma" autocomplete="off">
    <input id="casella" type="text" maxlength="60" enterkeyhint="go" autocapitalize="words" autocorrect="off" spellcheck="false">
    <button id="caso" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.6" cy="8.6" r="1.5" fill="currentColor"/><circle cx="15.4" cy="8.6" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="8.6" cy="15.4" r="1.5" fill="currentColor"/><circle cx="15.4" cy="15.4" r="1.5" fill="currentColor"/></svg></button>
    <button id="vai" type="submit">→</button>
  </form>
  <p id="aiuto"></p>
</main>

<p id="errore" hidden></p>
<script type="module" src="js/main.js"></script>
</body>
</html>
